name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'caregiver-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: caregiver-app
        run: npm ci
      - name: Build web assets
        working-directory: caregiver-app
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Sync Capacitor Android project
        working-directory: caregiver-app
        run: npx cap sync android
      - name: Bump Android versionCode so every build is a real update
        working-directory: caregiver-app/android/app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle
      - name: Decode signing keystore
        working-directory: caregiver-app/android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Make gradlew executable
        working-directory: caregiver-app/android
        run: chmod +x gradlew
      - name: Build signed release APK
        working-directory: caregiver-app/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Publish APK under a unique filename every build (defeats any CDN caching)
        run: |
          mkdir -p caregiver-app/public/downloads
          rm -f caregiver-app/public/downloads/golden-years-care-*.apk
          cp caregiver-app/android/app/build/outputs/apk/release/app-release.apk "caregiver-app/public/downloads/golden-years-care-${{ github.sha }}.apk"
          cp caregiver-app/android/app/build/outputs/apk/release/app-release.apk caregiver-app/public/downloads/golden-years-care.apk
          echo "{\"version\": \"${{ github.sha }}\", \"builtAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"apkFile\": \"golden-years-care-${{ github.sha }}.apk\"}" > caregiver-app/public/downloads/version.json
      - name: Deploy Care App PWA (with the new APK inside) to GitHub Pages
        working-directory: caregiver-app
        run: |
          rm -rf dist/downloads
          cp -r public/downloads dist/downloads
          npx gh-pages -d dist -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
      - name: Commit updated APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add caregiver-app/public/downloads/
          git diff --cached --quiet || git commit -m "Auto-build: update Android APK [skip ci]"
          git push
      - name: Notify caregivers of the new app version
        run: |
          curl -s -X POST "https://ufqbrqlthbviajnrybnm.supabase.co/rest/v1/rpc/notify_all_app_update" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
      - name: Upload APK as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: golden-years-care-apk
          path: caregiver-app/android/app/build/outputs/apk/release/app-release.apk
