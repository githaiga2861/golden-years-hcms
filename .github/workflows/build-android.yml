name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'caregiver-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: caregiver-app
        run: npm ci
      - name: Build web assets
        working-directory: caregiver-app
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build
      - name: Sync Capacitor Android project
        working-directory: caregiver-app
        run: npx cap sync android
      - name: Bump Android versionCode so every build is a real update
        working-directory: caregiver-app/android/app
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -n "versionCode\|versionName" build.gradle
      - name: Decode signing keystore
        working-directory: caregiver-app/android/app
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Make gradlew executable
        working-directory: caregiver-app/android
        run: chmod +x gradlew
      - name: Build signed release APK
        working-directory: caregiver-app/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Publish APK to a GitHub Release (not git — the APK is too large for normal git storage)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            "caregiver-app/android/app/build/outputs/apk/release/app-release.apk#golden-years-care.apk" \
            --title "Care App build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}"
      - name: Write version.json pointing at the release asset
        run: |
          mkdir -p caregiver-app/public/downloads
          APK_URL="https://github.com/${{ github.repository }}/releases/download/apk-${{ github.run_number }}/golden-years-care.apk"
          echo "{\"version\": \"${{ github.sha }}\", \"builtAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"apkUrl\": \"$APK_URL\"}" > caregiver-app/public/downloads/version.json
          cat caregiver-app/public/downloads/version.json
      - name: Deploy Care App PWA to GitHub Pages
        working-directory: caregiver-app
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf dist/downloads
          cp -r public/downloads dist/downloads
          npx gh-pages -d dist -r "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
      - name: Commit updated version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add caregiver-app/public/downloads/version.json
          git diff --cached --quiet || git commit -m "Auto-build: update version.json [skip ci]"
          git push
      - name: Notify caregivers of the new app version
        run: |
          curl -s -X POST "https://ufqbrqlthbviajnrybnm.supabase.co/rest/v1/rpc/notify_all_app_update" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
